<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SmartHome KMITL Dashboard</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Paho MQTT WebSocket Client -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Prompt', sans-serif; }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 md:p-8">

  <div class="max-w-4xl mx-auto space-y-6">
    <!-- Header -->
    <header class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 bg-slate-800/80 backdrop-blur p-6 rounded-2xl border border-slate-700 shadow-xl">
      <div>
        <h1 class="text-2xl font-bold tracking-tight text-white flex items-center gap-2">
          <span>💡</span> SmartHome Room Controller
        </h1>
        <p class="text-sm text-slate-400 mt-1 flex items-center gap-2">
          <span id="mqttStatusDot" class="w-2.5 h-2.5 rounded-full bg-amber-500 animate-pulse"></span>
          <span id="mqttStatusText">กำลังเชื่อมต่อ HiveMQ...</span>
        </p>
      </div>
      <div class="flex items-center gap-3">
        <!-- ปุ่มลิงก์ไปหน้าดูประวัติและ Login -->
        <a href="analytics.html" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-sm font-medium rounded-xl transition shadow-lg shadow-indigo-600/30 flex items-center gap-2">
          <span>📊</span> <span>ดูประวัติ & เข้าสู่ระบบ</span>
        </a>
      </div>
    </header>

    <!-- Master Control & Settings Panel -->
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
      <!-- Master Switch & Master Schedule -->
      <div class="bg-slate-800/60 p-5 rounded-2xl border border-slate-700 flex flex-col justify-between space-y-4">
        <div class="flex items-center justify-between">
          <div>
            <h2 class="font-semibold text-lg text-white">Master Control</h2>
            <p class="text-xs text-slate-400">สั่งเปิด-ปิดไฟพร้อมกันทุกช่อง</p>
          </div>
          <div class="flex gap-2">
            <button onclick="triggerMaster('ON')" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-sm font-medium rounded-xl transition-all active:scale-95">
              เปิดหมด
            </button>
            <button onclick="triggerMaster('OFF')" class="px-4 py-2 bg-rose-600 hover:bg-rose-500 text-sm font-medium rounded-xl transition-all active:scale-95">
              ปิดหมด
            </button>
          </div>
        </div>
        <div class="pt-3 border-t border-slate-700/60 grid grid-cols-2 gap-2 text-xs">
          <div>
            <label class="text-slate-400 block mb-1">เวลาเปิดทั้งหมด (Auto ON)</label>
            <input type="time" id="masterOnTime" onchange="updateMasterSchedule('on')" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-1.5 text-white focus:outline-none focus:border-blue-500">
          </div>
          <div>
            <label class="text-slate-400 block mb-1">เวลาปิดทั้งหมด (Auto OFF)</label>
            <input type="time" id="masterOffTime" onchange="updateMasterSchedule('off')" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-1.5 text-white focus:outline-none focus:border-blue-500">
          </div>
        </div>
      </div>

      <!-- Buzzer Toggle -->
      <div class="bg-slate-800/60 p-5 rounded-2xl border border-slate-700 flex items-center justify-between">
        <div>
          <h2 class="font-semibold text-lg text-white">Buzzer เสียงเตือน</h2>
          <p id="buzzerStatus" class="text-xs text-slate-400">สถานะ: กำลังโหลด...</p>
        </div>
        <button id="buzzerBtn" onclick="toggleBuzzer()" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 text-sm font-medium rounded-xl transition-all active:scale-95">
          🔊 สลับเสียง
        </button>
      </div>
    </div>

    <!-- 4 Relay Channels Grid -->
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
      <!-- Channel 1 -->
      <div class="bg-slate-800/70 p-5 rounded-2xl border border-slate-700 shadow-md space-y-4">
        <div class="flex justify-between items-center">
          <div class="flex items-center gap-3">
            <div id="bulbIcon1" class="w-10 h-10 rounded-xl bg-slate-700 flex items-center justify-center text-xl transition-all">⚪</div>
            <div>
              <h3 class="font-semibold text-white">ไฟช่อง 1</h3>
            </div>
          </div>
          <button id="toggleBtn1" onclick="toggleRelay(1)" class="px-4 py-2 rounded-xl text-sm font-medium bg-slate-700 hover:bg-slate-600 active:scale-95 transition-all">
            ...
          </button>
        </div>
        <div class="pt-3 border-t border-slate-700/60 grid grid-cols-2 gap-2 text-xs">
          <div>
            <label class="text-slate-400 block mb-1">เวลาเปิด (Auto ON)</label>
            <input type="time" id="onTime1" onchange="updateSchedule(1, 'on')" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-1.5 text-white focus:outline-none focus:border-blue-500">
          </div>
          <div>
            <label class="text-slate-400 block mb-1">เวลาปิด (Auto OFF)</label>
            <input type="time" id="offTime1" onchange="updateSchedule(1, 'off')" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-1.5 text-white focus:outline-none focus:border-blue-500">
          </div>
        </div>
      </div>

      <!-- Channel 2 -->
      <div class="bg-slate-800/70 p-5 rounded-2xl border border-slate-700 shadow-md space-y-4">
        <div class="flex justify-between items-center">
          <div class="flex items-center gap-3">
            <div id="bulbIcon2" class="w-10 h-10 rounded-xl bg-slate-700 flex items-center justify-center text-xl transition-all">⚪</div>
            <div>
              <h3 class="font-semibold text-white">ไฟช่อง 2</h3>
            </div>
          </div>
          <button id="toggleBtn2" onclick="toggleRelay(2)" class="px-4 py-2 rounded-xl text-sm font-medium bg-slate-700 hover:bg-slate-600 active:scale-95 transition-all">
            ...
          </button>
        </div>
        <div class="pt-3 border-t border-slate-700/60 grid grid-cols-2 gap-2 text-xs">
          <div>
            <label class="text-slate-400 block mb-1">เวลาเปิด (Auto ON)</label>
            <input type="time" id="onTime2" onchange="updateSchedule(2, 'on')" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-1.5 text-white focus:outline-none focus:border-blue-500">
          </div>
          <div>
            <label class="text-slate-400 block mb-1">เวลาปิด (Auto OFF)</label>
            <input type="time" id="offTime2" onchange="updateSchedule(2, 'off')" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-1.5 text-white focus:outline-none focus:border-blue-500">
          </div>
        </div>
      </div>

      <!-- Channel 3 -->
      <div class="bg-slate-800/70 p-5 rounded-2xl border border-slate-700 shadow-md space-y-4">
        <div class="flex justify-between items-center">
          <div class="flex items-center gap-3">
            <div id="bulbIcon3" class="w-10 h-10 rounded-xl bg-slate-700 flex items-center justify-center text-xl transition-all">⚪</div>
            <div>
              <h3 class="font-semibold text-white">ไฟช่อง 3</h3>
            </div>
          </div>
          <button id="toggleBtn3" onclick="toggleRelay(3)" class="px-4 py-2 rounded-xl text-sm font-medium bg-slate-700 hover:bg-slate-600 active:scale-95 transition-all">
            ...
          </button>
        </div>
        <div class="pt-3 border-t border-slate-700/60 grid grid-cols-2 gap-2 text-xs">
          <div>
            <label class="text-slate-400 block mb-1">เวลาเปิด (Auto ON)</label>
            <input type="time" id="onTime3" onchange="updateSchedule(3, 'on')" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-1.5 text-white focus:outline-none focus:border-blue-500">
          </div>
          <div>
            <label class="text-slate-400 block mb-1">เวลาปิด (Auto OFF)</label>
            <input type="time" id="offTime3" onchange="updateSchedule(3, 'off')" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-1.5 text-white focus:outline-none focus:border-blue-500">
          </div>
        </div>
      </div>

      <!-- Channel 4 -->
      <div class="bg-slate-800/70 p-5 rounded-2xl border border-slate-700 shadow-md space-y-4">
        <div class="flex justify-between items-center">
          <div class="flex items-center gap-3">
            <div id="bulbIcon4" class="w-10 h-10 rounded-xl bg-slate-700 flex items-center justify-center text-xl transition-all">⚪</div>
            <div>
              <h3 class="font-semibold text-white">ไฟช่อง 4</h3>
            </div>
          </div>
          <button id="toggleBtn4" onclick="toggleRelay(4)" class="px-4 py-2 rounded-xl text-sm font-medium bg-slate-700 hover:bg-slate-600 active:scale-95 transition-all">
            ...
          </button>
        </div>
        <div class="pt-3 border-t border-slate-700/60 grid grid-cols-2 gap-2 text-xs">
          <div>
            <label class="text-slate-400 block mb-1">เวลาเปิด (Auto ON)</label>
            <input type="time" id="onTime4" onchange="updateSchedule(4, 'on')" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-1.5 text-white focus:outline-none focus:border-blue-500">
          </div>
          <div>
            <label class="text-slate-400 block mb-1">เวลาปิด (Auto OFF)</label>
            <input type="time" id="offTime4" onchange="updateSchedule(4, 'off')" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-1.5 text-white focus:outline-none focus:border-blue-500">
          </div>
        </div>
      </div>
    </div>

    <!-- Live Event Log -->
    <div class="bg-slate-800/50 p-5 rounded-2xl border border-slate-700 text-xs text-slate-400">
      <div class="flex justify-between items-center mb-2 font-semibold text-slate-300">
        <span>📜 ประวัติการทำงานล่าสุด</span>
        <button onclick="document.getElementById('logArea').innerHTML=''" class="hover:text-white">ล้างประวัติ</button>
      </div>
      <div id="logArea" class="space-y-1 max-h-36 overflow-y-auto font-mono">
        <div>[System] หน้าเว็บโหลดเรียบร้อย พร้อมใช้งาน</div>
      </div>
    </div>
  </div>

  <script>
    // --- 1. การตั้งค่า HiveMQ และ Google Apps Script ---
    const MQTT_HOST = "4c4307568518463d97317cea07a00ac4.s1.eu.hivemq.cloud";
    const MQTT_PORT = 8884;
    const MQTT_USER = "BabyTrout";
    const MQTT_PASS = "2644@8246";
    const CLIENT_ID = "WebClient_" + Math.random().toString(16).substr(2, 8);
    
    // Web App URL จาก Gmail ใหม่
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwn1VgjaEhPSTBRGUy-OFbaEcjgSFXtTcjFV7yShiN1ndKDBLd7Xo_gq_6Wu55RERvH/exec";

    let client = null;
    let relayStates = { 1: false, 2: false, 3: false, 4: false };
    let buzzerState = true;

    function addLog(msg) {
      const logArea = document.getElementById("logArea");
      const timeStr = new Date().toLocaleTimeString();
      const line = document.createElement("div");
      line.innerText = `[${timeStr}] ${msg}`;
      logArea.prepend(line);
    }

    // ฟังก์ชันส่ง Log ไปยัง Google Sheets
    function logToGoogleSheets(channel, state) {
      const currentUser = localStorage.getItem("smarthome_user") || "Web_Guest";
      fetch(SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({
          action: "log",
          channel: String(channel),
          state: state,
          triggerBy: currentUser,
          device: "Web_Dashboard"
        })
      }).catch(err => console.warn("Log failed:", err));
    }

    // --- 2. เชื่อมต่อ MQTT ผ่าน WebSocket ---
    function connectMqtt() {
      client = new Paho.MQTT.Client(MQTT_HOST, MQTT_PORT, CLIENT_ID);
      client.onConnectionLost = onConnectionLost;
      client.onMessageArrived = onMessageArrived;

      const options = {
        useSSL: true,
        userName: MQTT_USER,
        password: MQTT_PASS,
        onSuccess: onConnectSuccess,
        onFailure: onConnectFailure
      };

      client.connect(options);
    }

    function onConnectSuccess() {
      document.getElementById("mqttStatusDot").className = "w-2.5 h-2.5 rounded-full bg-emerald-500";
      document.getElementById("mqttStatusText").innerText = "เชื่อมต่อ HiveMQ Cloud สำเร็จ";
      addLog("เชื่อมต่อ HiveMQ Cloud สำเร็จ");

      client.subscribe("myroom/relay/+/state");
      client.subscribe("myroom/buzzer/state");
      client.subscribe("myroom/schedule/+/on/state");
      client.subscribe("myroom/schedule/+/off/state");
      client.subscribe("myroom/schedule/all/on/state");
      client.subscribe("myroom/schedule/all/off/state");
    }

    function onConnectFailure(err) {
      document.getElementById("mqttStatusDot").className = "w-2.5 h-2.5 rounded-full bg-rose-500";
      document.getElementById("mqttStatusText").innerText = "เชื่อมต่อล้มเหลว กำลังลองใหม่...";
      addLog(`MQTT Error: ${err.errorMessage}`);
      setTimeout(connectMqtt, 5000);
    }

    function onConnectionLost(response) {
      if (response.errorCode !== 0) {
        document.getElementById("mqttStatusDot").className = "w-2.5 h-2.5 rounded-full bg-amber-500 animate-pulse";
        document.getElementById("mqttStatusText").innerText = "การเชื่อมต่อหลุด...";
        addLog(`Connection Lost: ${response.errorMessage}`);
        setTimeout(connectMqtt, 3000);
      }
    }

    function sendMqtt(topic, payload) {
      if (client && client.isConnected()) {
        const message = new Paho.MQTT.Message(payload);
        message.destinationName = topic;
        client.send(message);
      } else {
        alert("ยังไม่ได้เชื่อมต่อ MQTT Broker!");
      }
    }

    // --- 3. จัดการข้อความที่ได้รับ ---
    function onMessageArrived(message) {
      const topic = message.destinationName;
      const payload = message.payloadString;

      const relayMatch = topic.match(/myroom\/relay\/(\d+)\/state/);
      if (relayMatch) {
        const ch = parseInt(relayMatch[1]);
        const isOn = (payload === "ON");
        relayStates[ch] = isOn;
        updateRelayUI(ch, isOn);
        addLog(`หลอดไฟช่อง ${ch}: ${payload}`);
      }

      if (topic === "myroom/buzzer/state") {
        buzzerState = (payload === "ON");
        document.getElementById("buzzerStatus").innerText = `สถานะ: ${buzzerState ? "เปิดเสียง" : "ปิดเสียง"}`;
      }

      const schedOnMatch = topic.match(/myroom\/schedule\/(\d+)\/on\/state/);
      if (schedOnMatch) {
        const ch = schedOnMatch[1];
        const el = document.getElementById(`onTime${ch}`);
        if (el && payload !== "OFF") el.value = payload;
      }
      const schedOffMatch = topic.match(/myroom\/schedule\/(\d+)\/off\/state/);
      if (schedOffMatch) {
        const ch = schedOffMatch[1];
        const el = document.getElementById(`offTime${ch}`);
        if (el && payload !== "OFF") el.value = payload;
      }

      if (topic === "myroom/schedule/all/on/state") {
        const el = document.getElementById("masterOnTime");
        if (el && payload !== "OFF") el.value = payload;
      }
      if (topic === "myroom/schedule/all/off/state") {
        const el = document.getElementById("masterOffTime");
        if (el && payload !== "OFF") el.value = payload;
      }
    }

    // --- 4. UI Updates & Button Handlers ---
    function updateRelayUI(ch, isOn) {
      const btn = document.getElementById(`toggleBtn${ch}`);
      const bulb = document.getElementById(`bulbIcon${ch}`);
      if (!btn || !bulb) return;

      if (isOn) {
        btn.innerText = "เปิดอยู่ (กดเพื่อปิด)";
        btn.className = "px-4 py-2 rounded-xl text-sm font-medium bg-emerald-600 hover:bg-emerald-500 text-white shadow-lg shadow-emerald-600/30 active:scale-95 transition-all";
        bulb.className = "w-10 h-10 rounded-xl bg-amber-400 text-slate-900 flex items-center justify-center text-xl shadow-lg shadow-amber-400/40 transition-all";
        bulb.innerText = "💡";
      } else {
        btn.innerText = "ปิดอยู่ (กดเพื่อเปิด)";
        btn.className = "px-4 py-2 rounded-xl text-sm font-medium bg-slate-700 hover:bg-slate-600 text-slate-300 active:scale-95 transition-all";
        bulb.className = "w-10 h-10 rounded-xl bg-slate-700 text-slate-400 flex items-center justify-center text-xl transition-all";
        bulb.innerText = "⚪";
      }
    }

    function toggleRelay(ch) {
      const nextState = !relayStates[ch];
      const stateStr = nextState ? "ON" : "OFF";
      sendMqtt(`myroom/relay/${ch}/set`, stateStr);
      logToGoogleSheets(ch, stateStr);
    }

    function triggerMaster(state) {
      sendMqtt('myroom/relay/all/set', state);
      logToGoogleSheets("All", state);
    }

    function toggleBuzzer() {
      sendMqtt("myroom/buzzer/set", buzzerState ? "OFF" : "ON");
    }

    function updateSchedule(ch, type) {
      const el = document.getElementById(`${type}Time${ch}`);
      const val = el.value || "OFF";
      sendMqtt(`myroom/schedule/${ch}/${type}`, val);
      addLog(`ตั้งเวลาช่อง ${ch} (${type}): ${val}`);
    }

    function updateMasterSchedule(type) {
      const el = document.getElementById(`master${type.charAt(0).toUpperCase() + type.slice(1)}Time`);
      const val = el.value || "OFF";
      sendMqtt(`myroom/schedule/all/${type}`, val);
      addLog(`ตั้งเวลาเปิด-ปิดทั้งหมด (${type}): ${val}`);
    }

    window.onload = function() {
      connectMqtt();
    };
  </script>
</body>
</html>
